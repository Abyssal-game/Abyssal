# v618 : publication du site (GitHub Pages) et des mises à jour à distance de l'application.
# À chaque envoi sur main : les tests du jeu doivent passer, puis le site est fabriqué (le jeu seul), live.json est signé
# avec le secret LIVE_SIGN_KEY (clé secrète du propriétaire, jamais dans le dépôt) et le tout est publié.
# Réglage nécessaire une fois : GitHub → Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Site et mises à jour
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du jeu
        run: node --test tests/*.test.mjs
      - name: Fabriquer et signer le site
        env:
          LIVE_SIGN_KEY: ${{ secrets.LIVE_SIGN_KEY }}
        run: node tools/live-site.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
