# Construit l'application Android (Capacitor) et l'essaie sur un téléphone simulé.
# Se lance à chaque publication qui touche au jeu, ou à la main (onglet Actions → Android → Run workflow).
# Résultats : onglet Actions → dernière exécution → « Artifacts » (application à installer, captures).
name: Android

on:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'data/**', 'assets/**', 'index.html', 'android/**', 'capacitor.config.json', 'package*.json', 'tools/build-www.mjs', 'tools/android-smoke.mjs', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write  # pour publier les captures sur la branche android-captures

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tests du jeu
        run: |
          npm ci
          node --test tests/*.test.mjs
          node tools/validate.mjs
      - name: Copie du jeu dans l'application
        run: |
          node tools/build-www.mjs
          npx cap sync android
      - name: Construction (version d'essai)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: abyssal-android-essai
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Activer l'accélération du téléphone simulé
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Essai sur un téléphone simulé (Android 15)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node tools/android-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abyssal-android-captures
          path: android-smoke/
          retention-days: 14
      - name: Publier les captures (branche android-captures, séparée du jeu)
        if: always()
        run: |
          [ -d android-smoke ] || exit 0
          cd android-smoke
          git init -q -b android-captures
          git add -A
          git -c user.name="Essai Android" -c user.email="actions@users.noreply.github.com" commit -qm "Captures de l'essai Android ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" android-captures
