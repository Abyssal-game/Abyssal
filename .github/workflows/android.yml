# Construit l'application Android (Capacitor) et l'essaie sur un téléphone simulé.
# Se lance à chaque publication qui touche au jeu, ou à la main (onglet Actions → Android → Run workflow).
# Résultats : onglet Actions → dernière exécution → « Artifacts » (application à installer, captures).
name: Android

on:
  push:
    branches: [main]
    paths: ['js/**', 'css/**', 'data/**', 'assets/**', 'index.html', 'android/**', 'capacitor.config.json', 'package*.json', 'tools/build-www.mjs', 'tools/android-smoke.mjs', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write  # pour publier les captures sur la branche android-captures

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tests du jeu
        run: |
          npm ci
          node --test tests/*.test.mjs
          node tools/validate.mjs
      - name: Firebase (notifications Android, v917 ; si le secret GOOGLE_SERVICES_JSON est posé)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "google-services.json posé"; else echo "pas de google-services.json : notifications du serveur absentes sur Android"; fi
      - name: Copie du jeu dans l'application
        run: |
          node tools/build-www.mjs
          npx cap sync android
      - name: Construction (version d'essai)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Version du Play Store (signée avec la clé d'envoi, si les secrets sont posés)
        if: env.HAS_KEY == 'true'
        working-directory: android
        env:
          ABYSSAL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # v885 : les gros dossiers partent dans le pack « ressources » (installé avec le jeu) : base sous 200 Mo
          PACK=ressources/src/main/assets/public/assets
          mkdir -p "$PACK"
          for d in art backs music; do mv "app/src/main/assets/public/assets/$d" "$PACK/$d"; done
          ABYSSAL_KEYSTORE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          unzip -l "$AAB" | awk '{ split($4, p, "/"); s[p[1]] += $1 } END { for (k in s) printf "%-14s %8.1f Mo\n", k, s[k] / 1048576 }'
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: abyssal-play-store
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: abyssal-android-essai
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Activer l'accélération du téléphone simulé
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Essai sur un téléphone simulé (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4a
          cores: 3
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: node tools/android-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: abyssal-android-captures
          path: android-smoke/
          retention-days: 14
      - name: Publier les captures (branche android-captures, séparée du jeu)
        if: always()
        run: |
          [ -d android-smoke ] || exit 0
          cd android-smoke
          git init -q -b android-captures
          git add -A
          git -c user.name="Essai Android" -c user.email="actions@users.noreply.github.com" commit -qm "Captures de l'essai Android ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" android-captures
